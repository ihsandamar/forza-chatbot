services:
  chatbot-api:
    build: .
    container_name: chatbot-api
    ports:
      - "${API_PORT:-8089}:8089"
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - ./.env:/app/.env:ro
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8089/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
