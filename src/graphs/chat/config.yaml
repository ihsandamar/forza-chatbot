name: "chat"
version: "1.0.0"
description: "Basic chat graph for conversational interactions"
category: "chat"

parameters:
  temperature: 0.7
  max_tokens: 2048
  timeout: 30
  max_retries: 3

capabilities:
  - "text_generation"
  - "conversation"

tags:
  - "chat"
  - "conversational"
  - "llm-powered"

