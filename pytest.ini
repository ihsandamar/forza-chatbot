[pytest]
# Pytest configuration for Forza Chatbot

# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    --strict-markers
    --verbose
    --tb=short
    --disable-warnings
    -ra

# Coverage options (when running with pytest-cov)
# Run with: pytest --cov=src --cov-report=html

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (medium speed)
    interface: Interface tests (test UI/API interaction)
    slow: Slow running tests
    skip: Skip test

# Python path - ensures src is in path
pythonpath = .
