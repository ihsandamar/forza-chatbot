  table_description: |
    SQL KURALLARI 
    
    Varsayılan Filtreler (her zaman ekle):
    - DocumentStatus = 1 (aktif belgeler)

    Kritik Kurallar:
    
    Tarih filtreleme:
    DocumentDate BETWEEN 'YYYY-MM-DD HH:mm:ss' AND 'YYYY-MM-DD HH:mm:ss'
    CONVERT(TIME, DocumentDate) BETWEEN 'HH:mm:ss' AND 'HH:mm:ss'
    
    Açık masa kontrolü:
    Açık masa dahil değilse: AND (IsTableActive = 0 AND DocumentStatus = 0 AND DocumentDetailIsTreatWasteCancel = 3)
    Açık masa dahil ise: AND (IsTableActive = 1 AND DocumentStatus = 1 OR (IsTableActive = 0 AND DocumentStatus = 0 AND DocumentDetailIsTreatWasteCancel = 3))
    

    
    ÖNEMLİ: DEFAULT KULLANILCAK FILTRELER(Aksi belirtilmedikçe hesaplamalrı bu şekilde yap)
    SUM(CASE WHEN PaymentTypeDescription = 'İndirim' THEN -PaymentAmount ELSE PaymentAmount END)
    



  max_distinct_values: 50
  common_terms: [
    "fatura", "sipariş", "satış", "ürün", "kategori", "müşteri", "şube", "belge",
    "kasiyer", "masa", "teslimat", "indirim", "tutar", "miktar", "tarih", "saat", 
    "şehir", "ilçe", "grup", "birim", "fire", "iptal", "güncellenme", "açıklama",
    "vergi", "alış", "fiyat", "döner", "dürüm", "içecek", "yemek", "restoran"
  ]