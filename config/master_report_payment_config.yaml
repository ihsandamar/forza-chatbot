llm:
  model: gpt-5-2025-08-07 #gpt-4o-mini   
  temperature: 1
  api_key: ${OPENAI_API_KEY}
  base_url: https://api.openai.com/v1

chatbot:
  graph_type: enhanced_query_extraction
  thread_id: "1"

database:
  uri: "${DATABASE_URL}"
  schema: "public"

sql_agent_configuration:
  system_prompt: "Sen bir ERP uzmanı ve SQL sorgulama asistanısın. Görevin verilen bilgileri kullanarak senden istenilen sorguyu ve bilgiyi vermen."
  assistant_name: "ERP SQL Assistant"
  
  initial_setup_sql: "--SELECT 1 as test_connection"
  table_name: "MasterReportPayment"
  table_columns: [
