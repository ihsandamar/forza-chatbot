chatbot:
  graph_type: supervisor

llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0
  api_key: ${OPENAI_API_KEY}
  base_url: https://api.openai.com/v1



database:
  uri: "${DATABASE_URL}"
  schema: "public"

forza:
  base_url: "https://forza.vegayazilim.com.tr:8805"
  web_site_url: "https://test.vegaforza.com"



embedding:
  provider: openai
  model: text-embedding-3-large
  api_key: ${OPENAI_API_KEY}
  base_url: https://api.openai.com/v1

vector_store:
  type: chroma
  chunk_size: 1024
  chunk_overlap: 128
  persist_directory: "./data/vector_store"